name: Build & Publish SageVault APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "SageVault.apk"
      - "releases/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure .env file exists
        run: |
          [ -f .env ] || cp .env.example .env

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Commit SageVault.apk to Repository
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk SageVault.apk
          cp app/build/outputs/apk/debug/app-debug.apk releases/SageVault.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f SageVault.apk releases/SageVault.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore: update pre-built SageVault.apk [skip ci]"
            git push
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SageVault-APK
          path: SageVault.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "SageVault v1.0.0 APK"
          body: "Ready-to-install Android APK for SageVault (Physical Card & Barcode Manager)."
          files: |
            SageVault.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
